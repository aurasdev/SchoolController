services:
  postgres:
    image: postgres:17-alpine
    container_name: school-controller-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_controller
      POSTGRES_USER: school_controller
      POSTGRES_PASSWORD: school_controller_dev
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
